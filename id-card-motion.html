let frontTextureCanvas=null,frontTexture=null;
const canvas=document.getElementById("badge");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.outputEncoding=THREE.sRGBEncoding;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(embedMode?34:32,1,.1,50);
camera.position.set(0,embedMode?0:0.4,embedMode?8:9);
scene.add(new THREE.AmbientLight(0xffffff,.85));
const key=new THREE.DirectionalLight(0xffffff,.8);key.position.set(2,4,6);scene.add(key);

const W=1.5,H=2,DEPTH=.04,RADIUS=.12,STRAP=1.9,SEGMENTS=12;
const font='"Helvetica Neue",Helvetica,Arial,sans-serif';

function roundedShape(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;
}
const cardShape=roundedShape(W,H,RADIUS);

function drawFront(ctx){
  ctx.fillStyle="#f5f5f8";ctx.fillRect(0,0,768,1024);
  ctx.fillStyle="#9292a0";ctx.font="500 20px "+font;ctx.fillText(PROFILE.role.toUpperCase(),48,62);
  ctx.save();ctx.beginPath();ctx.roundRect(40,84,688,640,40);ctx.clip();
  ctx.fillStyle="#101722";ctx.fillRect(40,84,688,640);
  if(projectImage.complete&&projectImage.naturalWidth){
    ctx.drawImage(projectImage,64,84,640,640);
  }
  ctx.restore();
  ctx.fillStyle="#14141a";ctx.font="700 78px "+font;ctx.fillText(PROFILE.name,48,808);
  ctx.fillStyle="#8a8a98";ctx.font="400 26px "+font;ctx.fillText(PROFILE.role,48,856);
  ctx.font="500 18px "+font;ctx.fillText(PROFILE.status.toUpperCase(),48,960);
  ctx.fillStyle="#14141a";ctx.beginPath();ctx.arc(686,945,26,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.fillRect(678,937,16,16);
}
function drawBack(ctx){
  ctx.fillStyle="#f1f1f5";ctx.fillRect(0,0,768,1024);
  ctx.fillStyle="#9292a0";ctx.font="500 20px "+font;ctx.fillText("CONTACT",48,62);
  ctx.fillStyle="#14141a";ctx.font="700 76px "+font;ctx.fillText(PROFILE.name,48,170);
  ctx.fillStyle="#858591";ctx.font="400 25px "+font;ctx.fillText(PROFILE.role,48,214);
  [["Email",PROFILE.email],["Social",PROFILE.handle],["Status",PROFILE.status]].forEach((row,i)=>{
    const y=270+i*108;ctx.fillStyle="#e8e8ed";ctx.beginPath();ctx.roundRect(40,y,688,88,24);ctx.fill();
    ctx.fillStyle="#92929d";ctx.font="400 21px "+font;ctx.fillText(row[0],68,y+54);
    ctx.fillStyle="#17171d";ctx.font="600 25px "+font;ctx.fillText(row[1].slice(0,27),230,y+54);
  });
  ctx.fillStyle="#17171d";ctx.font="600 25px "+font;ctx.fillText("Thanks for stopping by.",48,790);
}
function makeTexture(draw){
  const texCanvas=document.createElement("canvas");texCanvas.width=768;texCanvas.height=1024;
  draw(texCanvas.getContext("2d"));const t=new THREE.CanvasTexture(texCanvas);
  t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  if(draw===drawFront){frontTextureCanvas=texCanvas;frontTexture=t}
  return t;
}
function faceGeometry(reverse){
  const g=new THREE.ShapeGeometry(cardShape,12),p=g.attributes.position,uv=g.attributes.uv;
  for(let i=0;i<p.count;i++)uv.setXY(i,p.getX(i)/W+.5,p.getY(i)/H+.5);
  if(reverse)g.rotateY(Math.PI);return g;
}

const card=new THREE.Mesh(new THREE.ExtrudeGeometry(cardShape,{depth:DEPTH,bevelEnabled:false,curveSegments:12}),new THREE.MeshStandardMaterial({color:0xe9e9ee,roughness:.5}));
card.position.z=-DEPTH/2;
const front=new THREE.Mesh(faceGeometry(false),new THREE.MeshStandardMaterial({map:makeTexture(drawFront),roughness:.45}));front.position.z=DEPTH/2+.002;
const back=new THREE.Mesh(faceGeometry(true),new THREE.MeshStandardMaterial({map:makeTexture(drawBack),roughness:.45}));back.position.z=-DEPTH/2-.002;
if(projectImage.complete&&projectImage.naturalWidth)projectImageReady();
const metal=new THREE.MeshStandardMaterial({color:0xc9ccd2,metalness:.85,roughness:.27});

// Anchor → simulated strap → card pivot → flip group.
const anchor=new THREE.Group();scene.add(anchor);anchor.position.y=2.9+.22;
const swing=new THREE.Group();anchor.add(swing);
const N=SEGMENTS,LEN=STRAP,REST=LEN/N,points=[],previous=[],inverseMass=[];
for(let i=0;i<=N;i++){const p={x:0,y:-REST*i};points.push(p);previous.push({...p});inverseMass.push(i===0?0:i===N?.32:1)}

const ribbonPositions=new Float32Array((N+1)*6),ribbonUvs=new Float32Array((N+1)*4),indices=[];
for(let i=0;i<=N;i++){ribbonUvs.set([0,1-i/N,1,1-i/N],i*4);if(i<N){const a=i*2;indices.push(a,a+1,a+2,a+1,a+3,a+2)}}
const ribbonGeometry=new THREE.BufferGeometry();
ribbonGeometry.setAttribute("position",new THREE.BufferAttribute(ribbonPositions,3));
ribbonGeometry.setAttribute("uv",new THREE.BufferAttribute(ribbonUvs,2));ribbonGeometry.setIndex(indices);
const ribbonCanvas=document.createElement("canvas");ribbonCanvas.width=32;ribbonCanvas.height=512;
const rc=ribbonCanvas.getContext("2d");rc.fillStyle="#15151a";rc.fillRect(0,0,32,512);rc.fillStyle="#a9aee0";rc.font="12px sans-serif";rc.save();rc.translate(20,256);rc.rotate(-Math.PI/2);rc.textAlign="center";rc.fillText((PROFILE.name.toUpperCase()+" · AI / ML · ").repeat(8),0,0);rc.restore();
const ribbon=new THREE.Mesh(ribbonGeometry,new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(ribbonCanvas),side:THREE.DoubleSide}));ribbon.frustumCulled=false;swing.add(ribbon);
function updateRibbon(){
  for(let i=0;i<=N;i++){const a=points[Math.max(0,i-1)],b=points[Math.min(N,i+1)],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,nx=-dy/d*.1,ny=dx/d*.1;ribbonPositions.set([points[i].x+nx,points[i].y+ny,0,points[i].x-nx,points[i].y-ny,0],i*6)}
  ribbonGeometry.attributes.position.needsUpdate=true;
}
updateRibbon();

const pivot=new THREE.Group();pivot.position.y=-LEN;swing.add(pivot);
const loopClip=new THREE.Mesh(new THREE.TorusGeometry(.09,.022,10,24),metal);loopClip.position.y=-.12;pivot.add(loopClip);
const clipBody=new THREE.Mesh(new THREE.BoxGeometry(.1,.2,.04),metal);clipBody.position.y=-.02;pivot.add(clipBody);
const flip=new THREE.Group();flip.position.y=-.3-H/2;pivot.add(flip);flip.add(card,front,back);
const slot=new THREE.Mesh(new THREE.CircleGeometry(.05,16),new THREE.MeshBasicMaterial({color:0xcfcfd6}));slot.position.set(0,H/2-.14,DEPTH/2+.004);flip.add(slot);

let swingAngle=0,swingVelocity=0,tilt=0,tiltVelocity=0,flipAngle=0,flipTarget=0,flipVelocity=0,dropOffset=.22,dropVelocity=0,dropComplete=false;
const physicsSubsteps=embedMode?1:3,solverIterations=embedMode?5:10;
let sleeping=false,stillFor=0,animationFrame=0;
function wake(){sleeping=false;stillFor=0;if(embedMode&&!reducedMotion&&!animationFrame)animationFrame=requestAnimationFrame(animate)}
function step(dt){
  // The badge drops into frame once, then the strap and card settle naturally.
  if(!dropComplete){dropVelocity-=18*dt;dropOffset+=dropVelocity*dt;if(dropOffset<=0){dropOffset=0;dropVelocity=0;dropComplete=true}anchor.position.y=2.9+dropOffset}
  // Verlet strap with gravity, damping, and a lighter solver in the embedded preview.
  for(let sub=0;sub<physicsSubsteps;sub++){
    const h=dt/physicsSubsteps,g=-26*h*h;
    for(let i=1;i<=N;i++){const p=points[i],q=previous[i],vx=(p.x-q.x)*.78,vy=(p.y-q.y)*.78;q.x=p.x;q.y=p.y;p.x+=vx;p.y+=vy+g}
    for(let k=0;k<solverIterations;k++){
      points[0].x=0;points[0].y=0;
      for(let i=0;i<N;i++){const a=points[i],b=points[i+1],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6,diff=(d-REST)/d,wa=inverseMass[i],wb=inverseMass[i+1],sum=wa+wb;a.x+=dx*diff*wa/sum;a.y+=dy*diff*wa/sum;b.x-=dx*diff*wb/sum;b.y-=dy*diff*wb/sum}
    }
  }
  const ropeAngle=Math.atan2(points[N].x-points[N-2].x,-(points[N].y-points[N-2].y));
  swingVelocity+=(-90*(swingAngle-ropeAngle)-16*swingVelocity)*dt;swingAngle+=swingVelocity*dt;
  tiltVelocity+=(-18*tilt-6*tiltVelocity)*dt;tilt+=tiltVelocity*dt;
  flipVelocity+=(-90*(flipAngle-flipTarget)-14*flipVelocity)*dt;flipAngle+=flipVelocity*dt;
  pivot.position.set(points[N].x,points[N].y,0);pivot.rotation.z=swingAngle;pivot.rotation.x=tilt;flip.rotation.y=flipAngle;updateRibbon();
  let energy=Math.abs(swingVelocity)+Math.abs(tiltVelocity)+Math.abs(flipVelocity);
  for(let i=1;i<=N;i++)energy+=Math.hypot(points[i].x-previous[i].x,points[i].y-previous[i].y);
  if(energy<.006)stillFor+=dt;else stillFor=0;
  if(stillFor>.45){for(let i=1;i<=N;i++){previous[i].x=points[i].x;previous[i].y=points[i].y}swingVelocity=tiltVelocity=flipVelocity=0;sleeping=true}
}

function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.z=embedMode?(h<w?8.6:8):(h<w?9:10.5);camera.updateProjectionMatrix()}
window.addEventListener("resize",resize);resize();
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();let dragging=false,down=null;
function setMouse(e){const r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1))}
function hitCard(){raycaster.setFromCamera(mouse,camera);return raycaster.intersectObjects([card,front,back],false).length>0}
function dragCard(e){const r=canvas.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width*2-1;const world=nx*camera.position.z*Math.tan(camera.fov*Math.PI/360)*camera.aspect;points[N].x+=(Math.max(-LEN*.8,Math.min(LEN*.8,world))-points[N].x)*.09}
canvas.addEventListener("pointerdown",e=>{setMouse(e);if(hitCard()){wake();dragging=true;down={x:e.clientX,y:e.clientY,t:performance.now()};canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing"}});
canvas.addEventListener("pointermove",e=>{
  setMouse(e);const hit=hitCard();if(!dragging)canvas.style.cursor=hit?"grab":"default";
  if(dragging){wake();dragCard(e)}
});
canvas.addEventListener("pointerup",e=>{if(dragging&&down){const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);if(moved<12&&performance.now()-down.t<600){flipTarget+=Math.PI;wake()}}dragging=false;down=null;canvas.style.cursor="grab"});
document.getElementById("flip").addEventListener("click",()=>{flipTarget+=Math.PI;wake();previous[N].x-=.015});

const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;let lastFrame=performance.now();
function animate(now){animationFrame=0;const dt=Math.min((now-lastFrame)/1000,.033);lastFrame=now;if(!reducedMotion&&!sleeping)step(dt);const active=!embedMode||!sleeping||dragging;if(active)renderer.render(scene,camera);if(active)animationFrame=requestAnimationFrame(animate)}
animationFrame=requestAnimationFrame(animate);
</script>
